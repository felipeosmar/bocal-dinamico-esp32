<div class="toolbar">
    <button onclick="scanActuators()" class="btn-icon" title="Scan RS485 Bus">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    </button>
    <button onclick="refreshStatus()" class="btn-icon" title="Refresh Status">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
</div>

<div class="control-panels">
    <!-- Synchronized Group Card (Lens Focus - Actuators 1 & 2) -->
    <div class="control-card">
        <div class="card-header">
            <h3>🔗 Synchronized Group</h3>
            <span class="card-subtitle">Lens Focus (IDs: 1, 2)</span>
        </div>
        <div class="card-body">
            <div class="status-row">
                <div class="status-item">
                    <span class="label">Actuator #1</span>
                    <span id="sync-pos-1" class="value">--</span>
                    <span id="sync-status-1" class="status-dot"></span>
                </div>
                <div class="status-item">
                    <span class="label">Actuator #2</span>
                    <span id="sync-pos-2" class="value">--</span>
                    <span id="sync-status-2" class="status-dot"></span>
                </div>
                <div class="status-item desync">
                    <span class="label">Desync</span>
                    <span id="sync-desync" class="value">--</span>
                </div>
            </div>

            <div class="control-row">
                <label>Position</label>
                <input type="range" id="sync-pos" min="0" max="4095" value="2048">
                <input type="number" id="sync-pos-val" min="0" max="4095" value="2048">
            </div>
            <div class="control-row">
                <label>Speed</label>
                <input type="range" id="sync-spd" min="0" max="400" value="300">
                <input type="number" id="sync-spd-val" min="0" max="400" value="300">
                <small class="hint">Max: 400</small>
            </div>
            <div class="control-row">
                <label>Current</label>
                <input type="range" id="sync-cur" min="0" max="800" value="400">
                <input type="number" id="sync-cur-val" min="0" max="800" value="400">
            </div>
            <div class="quick-pos">
                <button onclick="syncQuickPos(0)">0%</button>
                <button onclick="syncQuickPos(1024)">25%</button>
                <button onclick="syncQuickPos(2048)">50%</button>
                <button onclick="syncQuickPos(3072)">75%</button>
                <button onclick="syncQuickPos(4095)">100%</button>
            </div>
            <button id="btn-sync-command" onclick="sendSyncCommand()" class="btn btn-primary full">
                Send Synchronized Command
            </button>
        </div>
    </div>

    <!-- Independent Actuator Card (Actuator 3) -->
    <div class="control-card">
        <div class="card-header">
            <h3>⚙️ Independent Actuator</h3>
            <span class="card-subtitle">Actuator #3</span>
        </div>
        <div class="card-body">
            <div class="status-row single">
                <div class="status-item">
                    <span class="label">Position</span>
                    <span id="ind-pos-display" class="value">--</span>
                </div>
                <div class="status-item">
                    <span class="label">Current</span>
                    <span id="ind-cur-display" class="value">--</span>
                </div>
                <div class="status-item">
                    <span class="label">Status</span>
                    <span id="ind-status-display" class="value">--</span>
                    <span id="ind-status-dot" class="status-dot"></span>
                </div>
            </div>

            <div class="control-row">
                <label>Force</label>
                <div class="toggle">
                    <button onclick="setIndForce(true)" id="btn-ind-force-on">ON</button>
                    <button onclick="setIndForce(false)" id="btn-ind-force-off">OFF</button>
                </div>
            </div>
            <div class="control-row">
                <label>Position</label>
                <input type="range" id="ind-pos" min="0" max="4095" value="2048">
                <input type="number" id="ind-pos-val" min="0" max="4095" value="2048">
            </div>
            <div class="control-row">
                <label>Speed</label>
                <input type="range" id="ind-spd" min="0" max="400" value="300">
                <input type="number" id="ind-spd-val" min="0" max="400" value="300">
                <small class="hint">Max: 400</small>
            </div>
            <div class="control-row">
                <label>Current</label>
                <input type="range" id="ind-cur" min="0" max="800" value="400">
                <input type="number" id="ind-cur-val" min="0" max="800" value="400">
            </div>
            <div class="quick-pos">
                <button onclick="indQuickPos(0)">0%</button>
                <button onclick="indQuickPos(1024)">25%</button>
                <button onclick="indQuickPos(2048)">50%</button>
                <button onclick="indQuickPos(3072)">75%</button>
                <button onclick="indQuickPos(4095)">100%</button>
            </div>
            <button id="btn-ind-command" onclick="sendIndCommand()" class="btn btn-primary full">
                Send Command
            </button>
        </div>
    </div>
</div>
